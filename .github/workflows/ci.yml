name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/lesha-vpn/gateway

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # root, so the generated nft rules are checked with `nft -c`
      - run: sudo env "PATH=$PATH" npm test

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm/v7'
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: lesha-vpn-gw:dev
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke
        run: |
          docker run --rm --platform ${{ matrix.platform }} lesha-vpn-gw:dev --version
          docker run --rm --platform ${{ matrix.platform }} --entrypoint awg lesha-vpn-gw:dev --version
          docker run --rm --platform ${{ matrix.platform }} --entrypoint amneziawg-go lesha-vpn-gw:dev --version
          docker run --rm --platform ${{ matrix.platform }} --entrypoint gost lesha-vpn-gw:dev -V
          docker run --rm --platform ${{ matrix.platform }} --entrypoint nft lesha-vpn-gw:dev --version
      - name: End-to-end
        if: matrix.platform != 'linux/arm/v7'
        run: IMAGE=lesha-vpn-gw:dev bash test/e2e/run.sh

  publish:
    needs: [test, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main → :edge; v0.1.0 → :0.1.0, :0.1, :latest
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
            type=gha,scope=linux/arm/v7
